openapi: 3.0.3
info:
  title: BCA Email Import Backend
  version: 1.0.0
  description: Owner API and worker-only BCA receipt ingestion. Monetary values are exact decimal strings in IDR major units.
servers:
  - url: http://127.0.0.1:18080
paths:
  /health/live:
    get:
      operationId: live
      responses:
        '200': {description: Process live}
  /health/ready:
    get:
      operationId: ready
      responses:
        '200': {description: Database and migrations ready}
        '503': {description: Database unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /metrics:
    get:
      operationId: metrics
      description: Private network only; reverse proxy blocks this route.
      responses:
        '200': {description: Prometheus text metrics}
  /auth/google/start:
    get:
      operationId: googleStart
      description: Open in a browser. Sets a short-lived state cookie and redirects to Google consent. For mobile, supply client=mobile and an S256 code_challenge; the server must have MOBILE_REDIRECT_URI configured.
      parameters:
        - {name: client, in: query, schema: {type: string, enum: [mobile]}, description: Omit for manual browser code display}
        - {name: code_challenge, in: query, schema: {type: string, minLength: 43, maxLength: 43}, description: Base64url SHA-256 of the app's code verifier; required for mobile}
      responses:
        '302': {description: Google authorization redirect}
        '400': {description: Invalid mobile client or challenge}
  /auth/google/callback:
    get:
      operationId: googleCallback
      description: Google redirects here; a successful manual flow shows a one-time application login code in HTML, while a mobile flow redirects to the configured app URI with the code in its query.
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: One-time code in HTML}
        '302': {description: Mobile flow redirects to configured app URI with one-time code}
        '400': {description: Invalid or expired authorization state}
        '403': {description: Google subject is not the configured owner}
  /api/v1/auth/exchange:
    post:
      operationId: exchangeCode
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], additionalProperties: false, properties: {code: {type: string}, code_verifier: {type: string, description: Required when the code originated from a mobile flow}}}
      responses:
        '200': {description: Application tokens, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {description: Invalid code, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Missing or malformed code, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [refresh_token], additionalProperties: false, properties: {refresh_token: {type: string}}}
      responses:
        '200': {description: Rotated application tokens, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}
        '401': {description: Invalid or reused refresh token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ownerBearer: []}]
      responses:
        '204': {description: Session family revoked}
        '401': {description: Unauthorized}
  /api/v1/me:
    get:
      operationId: me
      security: [{ownerBearer: []}]
      responses:
        '200':
          description: Owner profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  email: {type: string, format: email}
                  timezone: {type: string}
        '401': {description: Unauthorized}
  /api/v1/integrations/gmail:
    get:
      operationId: gmailStatus
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Connection status and last successful discovery, content: {application/json: {schema: {$ref: '#/components/schemas/GmailIntegration'}}}}
    delete:
      operationId: gmailDisconnect
      security: [{ownerBearer: []}]
      responses:
        '204': {description: Credentials removed; transactions retained}
        '404': {description: Integration missing}
  /api/v1/integrations/gmail/sync:
    post:
      operationId: gmailSync
      security: [{ownerBearer: []}]
      responses:
        '202': {description: Discovery scheduled, content: {application/json: {schema: {type: object, properties: {operation_id: {type: string, format: uuid}, status: {type: string}}}}}}
        '409': {description: Integration unavailable}
  /api/v1/integrations/gmail/sync/{id}:
    get:
      operationId: gmailSyncOutcome
      security: [{ownerBearer: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200':
          description: Durable discovery operation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [queued, running, completed, failed]}
                  reason_code: {type: string, nullable: true}
                  created_at: {type: string, format: date-time}
                  finished_at: {type: string, format: date-time, nullable: true}
        '404': {description: Operation not found}
  /api/v1/imports:
    get:
      operationId: listImports
      security: [{ownerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: state, in: query, schema: {type: string, enum: [queued, processing, retry_wait, completed, ignored, unsupported, needs_review, failed]}, description: Filter jobs by state}
      responses:
        '200': {description: BCA processing jobs without email content, content: {application/json: {schema: {$ref: '#/components/schemas/ImportPage'}}}}
  /api/v1/imports/{id}:
    get:
      operationId: getImport
      security: [{ownerBearer: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Safe import outcome, content: {application/json: {schema: {$ref: '#/components/schemas/ImportDetail'}}}}
        '404': {description: Import not found}
  /api/v1/imports/{id}/source:
    get:
      operationId: findImportSource
      description: Owner-only metadata lookup. Fetches the From header first, then subject, date and Message-ID for an exact BCA sender. No message body is fetched. Paste gmail_search into Gmail to open the email.
      security: [{ownerBearer: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200':
          description: Gmail source metadata
          content:
            application/json:
              schema:
                type: object
                required: [id, subject, date, gmail_search]
                properties:
                  id: {type: string, format: uuid}
                  subject: {type: string}
                  date: {type: string}
                  gmail_search: {type: string, description: Paste into the connected Gmail account search bar; empty if the message lacks a usable Message-ID header}
        '404': {description: Import not found or not owned}
        '503': {description: Gmail source unavailable}
  /api/v1/imports/{id}/inspect:
    get:
      operationId: inspectUnsupportedImport
      description: Owner-only on-demand inspection of one unsupported job. Refetches the BCA email after sender and receiver-authentication checks, returns bounded layout clues, and does not store the message or change the job.
      security: [{ownerBearer: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200':
          description: Current parser diagnosis
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  job_state: {type: string, enum: [unsupported]}
                  diagnostic:
                    type: object
                    properties:
                      parser_outcome: {type: string, enum: [supported, unsupported, ignored, needs_review, not_checked]}
                      reason_code: {type: string}
                      retry_recommended: {type: boolean, description: True when the current parser supports this previously unsupported job; inspection itself does not retry it}
                      subject: {type: string, description: Bounded subject preview; this field contains email content}
                      transaction_type: {type: string, description: Bounded transaction type preview}
                      transfer_type: {type: string, description: Bounded transfer type preview}
                      detected_fields: {type: array, items: {type: string}, description: Allowlisted field labels only}
                      receipt_kind: {type: string}
        '404': {description: Import not found or not owned}
        '409': {description: Job is not unsupported}
        '503': {description: Gmail inspection unavailable}
  /api/v1/imports/{id}/retry:
    post:
      operationId: retryImport
      security: [{ownerBearer: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '202': {description: Retry queued, content: {application/json: {schema: {type: object, required: [id, state], properties: {id: {type: string, format: uuid}, state: {type: string, enum: [queued]}}}}}}
        '409': {description: Job not retryable}
  /api/v1/webhooks/bca:
    post:
      operationId: ingestBCA
      description: Worker-only. Source job and matching persisted delivery payload are required.
      security: [{workerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BCAEvent'}
      responses:
        '201': {description: New financial event, content: {application/json: {schema: {$ref: '#/components/schemas/IngestResult'}}}}
        '200': {description: Identical duplicate, content: {application/json: {schema: {$ref: '#/components/schemas/IngestResult'}}}}
        '401': {description: Worker token missing or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Contradictory duplicate or disconnected integration, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Invalid event or unknown source, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/transactions:
    get:
      operationId: listTransactions
      security: [{ownerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: from, in: query, schema: {type: string, format: date}, description: Inclusive Asia/Jakarta calendar date}
        - {name: to, in: query, schema: {type: string, format: date}, description: Inclusive Asia/Jakarta calendar date}
        - {name: bank, in: query, schema: {type: string}}
        - {name: classification, in: query, schema: {type: string, enum: [unclassified, expense, internal_transfer]}}
        - {name: account, in: query, schema: {type: string}}
      responses:
        '200': {description: Transaction page, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionPage'}}}}
  /api/v1/transactions/{id}:
    get:
      operationId: getTransaction
      security: [{ownerBearer: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Transaction, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '404': {description: Transaction not found}
    patch:
      operationId: updateTransaction
      security: [{ownerBearer: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classification, note, expected_version]
              additionalProperties: false
              properties:
                classification: {type: string, enum: [unclassified, expense, internal_transfer]}
                note: {type: string, maxLength: 2000}
                expected_version: {type: integer, minimum: 1}
      responses:
        '200': {description: Updated transaction, content: {application/json: {schema: {$ref: '#/components/schemas/Transaction'}}}}
        '409': {description: Stale record version, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/owned-accounts:
    get:
      operationId: listOwnedAccounts
      security: [{ownerBearer: []}]
      responses:
        '200': {description: Masked owned accounts, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/OwnedAccount'}}}}}}}
    post:
      operationId: addOwnedAccount
      security: [{ownerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, account_number, label]
              additionalProperties: false
              properties:
                bank: {type: string}
                account_number: {type: string, pattern: '^[0-9]{5,40}$', writeOnly: true}
                label: {type: string}
      responses:
        '201': {description: Only masked identifier is returned, content: {application/json: {schema: {$ref: '#/components/schemas/OwnedAccount'}}}}
components:
  securitySchemes:
    ownerBearer: {type: http, scheme: bearer, bearerFormat: JWT}
    workerBearer: {type: http, scheme: bearer}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
  schemas:
    Error:
      type: object
      required: [code, request_id]
      properties:
        code: {type: string}
        request_id: {type: string}
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer, example: 900}
    GmailIntegration:
      type: object
      required: [status]
      description: When status is not_connected, the other fields are omitted.
      properties:
        status: {type: string, enum: [not_connected, connected, disconnected, reconnect_required]}
        recovery_status: {type: string, enum: [initial, recovering, complete]}
        last_success: {type: string, format: date-time, nullable: true}
        last_operation:
          type: object
          nullable: true
          required: [id, status]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [queued, running, completed, failed]}
    ImportState: {type: string, enum: [queued, processing, retry_wait, completed, ignored, unsupported, needs_review, failed]}
    ImportSummary:
      type: object
      required: [id, state, reason_code, attempts, created_at, transaction_id]
      properties:
        id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/ImportState'}
        reason_code: {type: string, nullable: true}
        attempts: {type: integer}
        created_at: {type: string, format: date-time}
        transaction_id: {type: string, format: uuid, nullable: true, description: Present for a job linked to a transaction}
    ImportDetail:
      type: object
      required: [id, state, reason_code, attempts, created_at, updated_at, transaction_id]
      properties:
        id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/ImportState'}
        reason_code: {type: string, nullable: true}
        attempts: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        transaction_id: {type: string, format: uuid, nullable: true, description: Present for a job linked to a transaction}
    ImportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ImportSummary'}}
        next_cursor: {type: string}
    Money: {type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: '3300000.00'}
    BCAEvent:
      type: object
      additionalProperties: false
      required: [source_job_id, source_message_id, parser_version, bank_reference, receipt_kind, status, currency, amount, source_account_alias, beneficiary_account_masked, transaction_date_local, timezone]
      properties:
        source_job_id: {type: string, format: uuid}
        source_message_id: {type: string}
        parser_version: {type: string, enum: [bca-account-v1, bca-interbank-v1, bca-qris-payment-v1, bca-flazz-top-up-v1, bca-qris-transfer-v1, bca-virtual-account-v1]}
        bank_reference: {type: string}
        receipt_kind: {type: string, enum: [bca_transfer, interbank_transfer, bca_payment]}
        status: {type: string, enum: [successful]}
        currency: {type: string, enum: [IDR]}
        amount: {$ref: '#/components/schemas/Money'}
        fee: {allOf: [{$ref: '#/components/schemas/Money'}], nullable: true}
        source_account_alias: {type: string}
        beneficiary_bank: {type: string}
        beneficiary_account_masked: {type: string}
        payment_to: {type: string, description: "QRIS recipient, masked Flazz card, or virtual-account company/product shown on the receipt"}
        beneficiary_match_token: {type: string, pattern: '^[0-9a-f]{64}$'}
        transaction_date_local: {type: string, example: '2026-10-02T11:20:40'}
        timezone: {type: string, enum: [Asia/Jakarta]}
    IngestResult:
      type: object
      required: [id, created]
      properties:
        id: {type: string, format: uuid}
        created: {type: boolean}
    Transaction:
      type: object
      required: [id, bank_reference, receipt_kind, classification, occurred_at, amount, fee, currency, source_account_alias, beneficiary_bank, beneficiary_account_masked, note, version, created_at]
      properties:
        id: {type: string, format: uuid}
        bank_reference: {type: string}
        receipt_kind: {type: string}
        classification: {type: string, enum: [unclassified, expense, internal_transfer]}
        occurred_at: {type: string, format: date-time}
        amount: {$ref: '#/components/schemas/Money'}
        fee: {allOf: [{$ref: '#/components/schemas/Money'}], nullable: true}
        currency: {type: string, enum: [IDR]}
        source_account_alias: {type: string}
        beneficiary_bank: {type: string}
        beneficiary_account_masked: {type: string}
        payment_to: {type: string, description: "QRIS recipient, masked Flazz card, or virtual-account company/product shown on the receipt"}
        note: {type: string}
        version: {type: integer}
        created_at: {type: string, format: date-time}
    TransactionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Transaction'}}
        next_cursor: {type: string}
    OwnedAccount:
      type: object
      required: [id, bank, masked_identifier, label]
      properties:
        id: {type: string, format: uuid}
        bank: {type: string}
        masked_identifier: {type: string}
        label: {type: string}
